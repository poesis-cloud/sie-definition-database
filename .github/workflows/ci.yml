name: definition-database-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint
        run: |
          helm lint deploy/helm/sie-definition-database
      - name: Validate chart
        run: |
          helm template test deploy/helm/sie-definition-database > /dev/null
